<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI工作资源管理台 · 办公室</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    background: #14161c; color: #dfe3ea; overflow: hidden;
  }
  #app { display: flex; height: 100vh; }
  #stage { position: relative; flex: 1 1 auto; min-width: 0; }
  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; }
  #view2d { position: absolute; inset: 0; display: none; background: #1a1d24; }
  #view2d.on { display: block; }
  #view2d svg { width: 100%; height: 100%; display: block; }
  #hud {
    position: absolute; left: 14px; top: 12px; z-index: 5; pointer-events: none;
    background: rgba(20,22,28,.72); border: 1px solid #2c303c; border-radius: 10px;
    padding: 8px 12px; backdrop-filter: blur(4px);
  }
  #hud .title { font-size: 15px; font-weight: 600; letter-spacing: .06em; }
  #hud .counts { margin-top: 3px; font-size: 12px; color: #9aa3b2; }
  #hud .counts b { color: #dfe3ea; font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 10px; vertical-align: 1px; }
  .dot:first-child { margin-left: 0; }
  #modeBanner {
    display: none; position: absolute; left: 50%; transform: translateX(-50%); top: 12px; z-index: 7;
    background: rgba(96,58,14,.92); color: #ffe1b0; border: 1px solid #a8742c; border-radius: 9px;
    padding: 7px 14px; font-size: 12.5px; max-width: 70%; text-align: center;
  }
  #modeBanner.ok { background: rgba(23,64,38,.92); color: #b9f0cd; border-color: #2f7a4c; }
  #topControls {
    position: absolute; right: 14px; top: 12px; z-index: 6;
    display: flex; gap: 8px; align-items: center;
  }
  #viewToggle {
    display: flex; background: rgba(20,22,28,.85); border: 1px solid #2c303c;
    border-radius: 9px; overflow: hidden;
  }
  #viewToggle button {
    background: transparent; color: #9aa3b2; border: none; cursor: pointer;
    padding: 7px 18px; font-size: 13.5px; font-weight: 600; letter-spacing: .05em;
  }
  #viewToggle button.on { background: #3a6fd8; color: #fff; }
  #viewToggle button:not(.on):hover { color: #e6eaf1; }
  #resetView {
    background: rgba(20,22,28,.85); color: #c9d1de; border: 1px solid #2c303c;
    border-radius: 9px; padding: 7px 12px; font-size: 12.5px; cursor: pointer;
  }
  #resetView:hover { border-color: #4a5163; color: #fff; }
  #hint {
    position: absolute; left: 14px; bottom: 12px; z-index: 5; pointer-events: none;
    font-size: 12px; color: #79828f;
  }
  /* ---------- 右侧面板 ---------- */
  #panel {
    flex: 0 0 348px; display: flex; flex-direction: column;
    background: #191c23; border-left: 1px solid #2a2e39; min-height: 0;
  }
  #panel header { padding: 12px 14px 8px; border-bottom: 1px solid #262a35; }
  #panel header h1 { font-size: 15px; font-weight: 600; letter-spacing: .05em; }
  #panel header .sub { margin-top: 4px; font-size: 12px; color: #8b93a3; }
  .sec-title {
    padding: 10px 14px 6px; font-size: 12px; color: #8b93a3; letter-spacing: .12em;
    display: flex; justify-content: space-between; align-items: center;
  }
  #clearFilter {
    display: none; font-size: 12px; color: #7aa2f7; background: none; border: none;
    cursor: pointer; letter-spacing: 0; padding: 0;
  }
  #members { overflow-y: auto; padding: 0 8px 6px; flex: 0 1 44%; min-height: 120px; }
  .mrow {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px;
    cursor: pointer; border: 1px solid transparent;
  }
  .mrow:hover { background: #21252f; }
  .mrow.sel { background: #232936; border-color: #3a4358; }
  .mrow .dot { margin: 0; flex: 0 0 auto; }
  .mrow .nm { flex: 0 0 auto; font-size: 13px; font-weight: 600; max-width: 118px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .tk { flex: 1 1 auto; font-size: 12px; color: #9aa3b2; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .mrow.off .nm, .mrow.off .tk { color: #5d6572; }
  #events { overflow-y: auto; padding: 2px 14px 14px; flex: 1 1 auto; min-height: 0;
    border-top: 1px solid #262a35; }
  .ev { padding: 7px 0; border-bottom: 1px dashed #242833; font-size: 12.5px; line-height: 1.55; }
  .ev:last-child { border-bottom: none; }
  .ev .tm { color: #6d7584; font-variant-numeric: tabular-nums; margin-right: 7px; }
  .ev .who { font-weight: 600; margin-right: 6px; }
  .ev .tx { color: #c3c9d4; }
  .ev.note .tx { color: #9aa3b2; }
  .empty { padding: 16px 0; color: #6d7584; font-size: 12.5px; }
  #loadErr {
    display: none; margin: 12px 14px; padding: 10px 12px; font-size: 12.5px; line-height: 1.6;
    background: #2a1f1f; border: 1px solid #5a3434; border-radius: 8px; color: #e0a3a3;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #303644; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="scene"></div>
    <div id="view2d"><svg id="svg2d" viewBox="0 0 820 620" preserveAspectRatio="xMidYMid meet" aria-label="办公室 2D 俯视"></svg></div>
    <div id="hud">
      <div class="title" id="hudTitle">AI工作资源管理台</div>
      <div class="counts" id="counts"></div>
    </div>
    <div id="modeBanner"></div>
    <div id="topControls">
      <div id="viewToggle" role="group" aria-label="视图切换">
        <button type="button" data-view="3d" class="on">3D</button>
        <button type="button" data-view="2d">2D</button>
      </div>
      <button id="resetView" type="button">复位视角</button>
    </div>
    <div id="hint">拖动旋转 · 滚轮缩放 · 点成员或右侧名单定位</div>
  </div>
  <aside id="panel">
    <header>
      <h1 id="panelTitle">动态消息流</h1>
      <div class="sub" id="panelSub">每 3 秒同步状态与事件</div>
    </header>
    <div id="loadErr">数据加载失败。请确认本程序的本地服务正在运行（请用启动脚本打开，不要直接双击 HTML 文件），或到管理台「设置 → 数据源」检查设置。</div>
    <div class="sec-title"><span id="secMembers">成员状态</span><button id="clearFilter" type="button">清除筛选 ✕</button></div>
    <div id="members"></div>
    <div class="sec-title"><span id="secEvents">事件流</span><span id="evCount"></span></div>
    <div id="events"></div>
  </aside>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
